
name: Build Advanced Video Player APK

on:
  workflow_dispatch:

  push:
    paths:
      - 'AdvancedVideoPlayer.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # 5. Install Android SDK 35
      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 6. Extract project
      - name: Extract project
        run: |
          test -f AdvancedVideoPlayer.zip
          unzip -q AdvancedVideoPlayer.zip -d extracted
          test -d extracted/AdvancedVideoPlayer/AdvancedVideoPlayer
          
      
      # Replace original Kotlin files with fixed files from ZIP
      - name: Apply Kotlin fixes
        run: |
          PROJECT="extracted/AdvancedVideoPlayer/AdvancedVideoPlayer"
          DATA="$PROJECT/app/src/main/java/com/advancedvideoplayer/data"
          UI="$PROJECT/app/src/main/java/com/advancedvideoplayer/ui"

          # Replace original files
          cp "$DATA/MetadataExtractor_fixed.kt" "$DATA/MetadataExtractor.kt"
          cp "$UI/PlayerScreen_fixed.kt" "$UI/PlayerScreen.kt"

          # Remove duplicate fixed files
          rm -f "$DATA/MetadataExtractor_fixed.kt"
          rm -f "$UI/PlayerScreen_fixed.kt"

          echo "Both Kotlin files replaced successfully"


      # 7. Fix missing launcher icon
      - name: Fix Missing App Launcher Icon
        working-directory: extracted/AdvancedVideoPlayer/AdvancedVideoPlayer
        run: |
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">

              <path
                  android:fillColor="#263238"
                  android:pathData="M0,0h48v48h-48z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M17,10 L38,24 L17,38 Z"/>
          </vector>
          EOF

          find app/src/main -type f -name "*.xml" -exec sed -i \
            's|@mipmap/ic_launcher_round|@drawable/ic_launcher|g; s|@mipmap/ic_launcher|@drawable/ic_launcher|g' {} +

          echo "Launcher icon resource created."

      # 8. Update FFmpeg dependency
      - name: Update FFmpeg dependency
        working-directory: extracted/AdvancedVideoPlayer/AdvancedVideoPlayer
        run: |
          sed -i 's#com.arthenica:ffmpeg-kit-full:6.0-2#dev.ffmpegkit-maintained:ffmpeg-kit-full:6.0.3#' app/build.gradle.kts

      # 9. Build Debug APK
      - name: Build Debug APK
        working-directory: extracted/AdvancedVideoPlayer/AdvancedVideoPlayer
        run: |
          gradle --no-daemon assembleDebug

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-Video-Player-APK
          path: extracted/AdvancedVideoPlayer/AdvancedVideoPlayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
